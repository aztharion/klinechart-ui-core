<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KlineChart UI Core</title>
    <script>
      (function () {
        try {
          const t =
            localStorage.getItem("theme") ||
            localStorage.getItem("klinechart:chart:theme") ||
            localStorage.getItem("jtrader:chart:theme");
          const theme = t ? (t.startsWith('"') ? JSON.parse(t) : t) : "dark";
          if (theme === "light") {
            document.documentElement.classList.remove("dark");
          } else {
            document.documentElement.classList.add("dark");
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
